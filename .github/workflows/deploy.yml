name: Regenerate & Deploy Audits

on:
  push:
    branches: [gh-pages]
    paths:
      - 'audits/**'
      - 'generator/**'
      - 'generate-audit.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-audits
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-regen]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate all audit decks
        run: |
          set -e
          for f in audits/*.json; do
            name=$(basename "$f" .json)
            if [ "$name" = "_template" ]; then continue; fi
            echo "==> Generating $name from $f"
            node generate-audit.mjs "$f"
          done

      - name: Commit & push regenerated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate audit decks [skip-regen]"
          git push origin gh-pages
